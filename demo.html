<!doctype html>
    <html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FR24 Dashboard Card Demo</title>
    <style>
      :root {
        --primary-color: #0097a7;
        --accent-color: #ffb300;
        --success-color: #2e7d32;
        --primary-text-color: #17212b;
        --secondary-text-color: #607180;
        --primary-background-color: #eef3f6;
        --card-background-color: #ffffff;
        --ha-card-background: #ffffff;
        --divider-color: #d8e0e6;
        --ha-card-border-radius: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 32px 16px;
        background: #dfe8ec;
      }

      main {
        width: min(1120px, 100%);
      }
    </style>
  </head>
  <body>
    <main>
      <fr24-dashboard-card id="demo-card"></fr24-dashboard-card>
    </main>

    <script>
      customElements.define(
        "ha-card",
        class extends HTMLElement {
          connectedCallback() {
            this.style.display = "block";
            this.style.boxShadow = "0 10px 30px rgba(15, 23, 42, 0.12)";
          }
        },
      );

      customElements.define(
        "ha-icon",
        class extends HTMLElement {
          static get observedAttributes() {
            return ["icon"];
          }

          connectedCallback() {
            this.render();
          }

          attributeChangedCallback() {
            this.render();
          }

          render() {
            const icon = this.getAttribute("icon") || "";
            const glyph = icon.includes("radar")
              ? "*"
              : icon.includes("map")
                ? "+"
                : icon.includes("chevron-up")
                  ? "^"
                  : icon.includes("chevron-down")
                    ? "v"
                    : ">";
            this.innerHTML = `<span aria-hidden="true">${glyph}</span>`;
          }
        },
      );
    </script>
    <script src="./fr24-dashboard-card.js"></script>
    <script>
      const flights = [
        {
          id: "ex123",
          flight_number: "EX123",
          callsign: "EXA123",
          airline_short: "Example Air",
          aircraft_model: "Airbus A320",
          aircraft_registration: "N-EX123",
          origin_city: "Northport",
          destination_city: "Eastbay",
          altitude: 6250,
          ground_speed: 290,
          distance: 0.9,
          latitude: 51.505,
          longitude: -0.13,
          heading: 86,
          tracked_type: "Live",
        },
        {
          id: "cs456",
          flight_number: "CS456",
          callsign: "CSH456",
          airline_short: "Coastal Shuttle",
          aircraft_model: "Boeing 737-800",
          origin_city: "Westhaven",
          destination_city: "Lakeside",
          altitude: 18750,
          ground_speed: 412,
          distance: 18.4,
          latitude: 51.56,
          longitude: -0.02,
          heading: 118,
        },
        {
          id: "mt789",
          flight_number: "MT789",
          airline_short: "Metro Wings",
          aircraft_model: "Embraer 195-E2",
          origin_city: "Rivergate",
          destination_city: "Hillcrest",
          altitude: 10900,
          ground_speed: 336,
          distance: 32.7,
          latitude: 51.42,
          longitude: -0.22,
          heading: 42,
        },
      ];

      const now = Date.now();
      const mockHass = {
        config: { latitude: 51.5007, longitude: -0.1246 },
        states: {
          "sensor.flightradar24_current_in_area": {
            state: "3",
            attributes: { friendly_name: "Current in area", flights },
          },
          "sensor.flightradar24_entered_area": {
            state: "7",
            attributes: { friendly_name: "Entered area" },
          },
          "sensor.flightradar24_exited_area": {
            state: "4",
            attributes: { friendly_name: "Exited area" },
          },
        },
        callWS: async () => [
          [
            {
              last_changed: new Date(now - 90 * 60 * 1000).toISOString(),
              attributes: { flights: [flights[0], flights[1]] },
            },
            {
              last_changed: new Date(now - 210 * 60 * 1000).toISOString(),
              attributes: {
                flights: [
                  {
                    id: "nv830",
                    flight_number: "NV830",
                    airline_short: "North Valley",
                    aircraft_model: "Airbus A321neo",
                  },
                ],
              },
            },
          ],
        ],
      };

      const mapHtml = encodeURIComponent(`
        <style>
          body { margin: 0; font-family: system-ui; background: #17313c; color: white; }
          .map { height: 100vh; position: relative; overflow: hidden; background:
            linear-gradient(30deg, rgba(255,255,255,.08) 1px, transparent 1px),
            linear-gradient(120deg, rgba(255,255,255,.06) 1px, transparent 1px),
            radial-gradient(circle at center, rgba(0,151,167,.34), transparent 34%),
            #17313c; background-size: 76px 76px, 92px 92px, auto, auto; }
          .radius { position:absolute; left:50%; top:50%; width:42vmin; height:42vmin; border:2px solid #ffb300; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 50px rgba(255,179,0,.22); }
          .home { position:absolute; left:50%; top:50%; width:12px; height:12px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); }
          .plane { position:absolute; color:#ffb300; font-size:34px; transform:rotate(-28deg); }
          .p1 { left:38%; top:34%; } .p2 { left:63%; top:43%; color:#5eead4; } .p3 { left:48%; top:68%; }
          .label { position:absolute; left:18px; bottom:18px; font-weight:700; opacity:.84; }
        </style>
        <div class="map"><div class="radius"></div><div class="home"></div><div class="plane p1">&gt;</div><div class="plane p2">&gt;</div><div class="plane p3">&gt;</div><div class="label">Demo radar - 25 km</div></div>
      `);

      const card = document.getElementById("demo-card");
      card.setConfig({
        type: "custom:fr24-dashboard-card",
        title: "FlightRadar24",
        entity: "sensor.flightradar24_current_in_area",
        entered_entity: "sensor.flightradar24_entered_area",
        exited_entity: "sensor.flightradar24_exited_area",
        radius: 25,
        current_radius: 10,
        history_hours: 6,
        map_provider: "custom",
        map_url_template: `data:text/html;charset=utf-8,${mapHtml}`,
        map_render_mode: "local",
        map_height: 360,
        card_height: 820,
        section_max_height: 420,
        grid_columns: 12,
        grid_rows: 0,
        default_open: ["overview", "map", "activity"],
        remember_sections: true,
      });
      card.hass = mockHass;
    </script>
  </body>
</html>
